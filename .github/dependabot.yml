# Security fixes arrive as soon as they exist (repository setting). Version updates
# come once a month, one grouped pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: monthly }
    groups: { go: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /cloudflare
    schedule: { interval: monthly }
    groups: { worker: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
